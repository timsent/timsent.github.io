<svg viewBox="0 0 520 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowT" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#9a9a94"/></marker>
  </defs>
  <!-- ENCODER stack (left) -->
  <text x="115" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#1c5fdd">Encoder</text>
  <rect x="30" y="380" width="170" height="120" rx="8" fill="none" stroke="#1c5fdd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="205" y="440" font-family="JetBrains Mono, monospace" font-size="10" fill="#1c5fdd">N×</text>

  <rect x="45" y="460" width="140" height="30" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/><text x="115" y="479" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#1c5fdd">Add &amp; Norm</text>
  <rect x="45" y="420" width="140" height="30" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="115" y="439" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#19191a">Feed Forward</text>
  <rect x="45" y="390" width="140" height="24" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/><text x="115" y="406" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#1c5fdd">Add &amp; Norm</text>

  <rect x="45" y="330" width="140" height="34" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="115" y="351" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#19191a">Multi-Head Attention</text>

  <line x1="115" y1="364" x2="115" y2="380" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="115" y1="414" x2="115" y2="420" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="115" y1="450" x2="115" y2="460" stroke="#c8c8c2" marker-end="url(#arrowT)"/>

  <rect x="45" y="270" width="140" height="30" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="115" y="289" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#19191a">Positional Encoding +</text>
  <rect x="45" y="230" width="140" height="30" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="115" y="249" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#19191a">Input Embedding</text>
  <text x="115" y="215" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#60605a">Inputs</text>
  <line x1="115" y1="300" x2="115" y2="330" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="115" y1="260" x2="115" y2="270" stroke="#c8c8c2" marker-end="url(#arrowT)"/>

  <!-- DECODER stack (right) -->
  <text x="380" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#e8433d">Decoder</text>
  <rect x="295" y="260" width="170" height="220" rx="8" fill="none" stroke="#e8433d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="470" y="370" font-family="JetBrains Mono, monospace" font-size="10" fill="#e8433d">N×</text>

  <rect x="310" y="440" width="140" height="26" rx="6" fill="#fdecea" stroke="#e8433d" stroke-width="1.2"/><text x="380" y="457" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#e8433d">Add &amp; Norm</text>
  <rect x="310" y="404" width="140" height="30" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="380" y="423" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#19191a">Feed Forward</text>
  <rect x="310" y="378" width="140" height="20" rx="6" fill="#fdecea" stroke="#e8433d" stroke-width="1.2"/><text x="380" y="392" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#e8433d">Add &amp; Norm</text>
  <rect x="310" y="338" width="140" height="34" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="380" y="352" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#19191a">Multi-Head Attention</text>
  <text x="380" y="363" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="6.5" fill="#9a9a94">(cross, from encoder)</text>
  <rect x="310" y="312" width="140" height="20" rx="6" fill="#fdecea" stroke="#e8433d" stroke-width="1.2"/><text x="380" y="326" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#e8433d">Add &amp; Norm</text>
  <rect x="310" y="268" width="140" height="38" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="380" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#19191a">Masked Multi-Head</text><text x="380" y="296" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#19191a">Attention</text>

  <line x1="380" y1="306" x2="380" y2="312" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="332" x2="380" y2="338" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="372" x2="380" y2="378" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="398" x2="380" y2="404" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="434" x2="380" y2="440" stroke="#c8c8c2" marker-end="url(#arrowT)"/>

  <!-- cross-attention from encoder to decoder -->
  <path d="M 185 400 C 250 400, 250 355, 310 355" fill="none" stroke="#9a9a94" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowT)"/>

  <rect x="310" y="200" width="140" height="30" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="380" y="219" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#19191a">Positional Encoding +</text>
  <rect x="310" y="160" width="140" height="30" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="380" y="179" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#19191a">Output Embedding</text>
  <text x="380" y="145" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">Outputs (shifted right)</text>
  <line x1="380" y1="230" x2="380" y2="260" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="190" x2="380" y2="200" stroke="#c8c8c2" marker-end="url(#arrowT)"/>

  <!-- output head -->
  <rect x="310" y="90" width="140" height="26" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/><text x="380" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#1c5fdd">Softmax</text>
  <rect x="310" y="55" width="140" height="26" rx="6" fill="#ffffff" stroke="#e4e4e0" stroke-width="1.2"/><text x="380" y="72" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#19191a">Linear</text>
  <text x="380" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">Output Probabilities</text>
  <line x1="380" y1="81" x2="380" y2="90" stroke="#c8c8c2" marker-end="url(#arrowT)"/>
  <line x1="380" y1="260" x2="380" y2="230" stroke="#c8c8c2" stroke-width="0"/>
  <line x1="380" y1="116" x2="380" y2="200" stroke="#c8c8c2" stroke-width="0"/>
  <line x1="380" y1="480" x2="380" y2="500" stroke="#c8c8c2" stroke-width="0"/>
  <line x1="380" y1="200" x2="380" y2="116" stroke="none"/>
</svg>
