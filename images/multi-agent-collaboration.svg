  <text x="520" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">exposes tools</text>
  <text x="520" y="108" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">exposes resources</text>
  <text x="520" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">exposes prompts</text>

  <line x1="220" y1="80" x2="416" y2="80" stroke="#9a9a94" stroke-width="1.3" marker-end="url(#arrowMCP)"/>
  <line x1="416" y1="100" x2="220" y2="100" stroke="#9a9a94" stroke-width="1.3" marker-end="url(#arrowMCP)"/>
  <text x="320" y="72" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#9a9a94">JSON-RPC 2.0</text>
</svg>
