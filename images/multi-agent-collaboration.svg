<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowSeq" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#60605a" />
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="140" y1="40" x2="140" y2="430" stroke="#c8c8c2" stroke-width="1.2" stroke-dasharray="3,4"/>
  <line x1="500" y1="40" x2="500" y2="430" stroke="#c8c8c2" stroke-width="1.2" stroke-dasharray="3,4"/>

  <!-- lifeline headers -->
  <rect x="60" y="10" width="160" height="30" rx="6" fill="#fff" stroke="#c8c8c2" stroke-width="1.2"/>
  <text x="140" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#19191a">Application</text>
  <rect x="420" y="10" width="160" height="30" rx="6" fill="#fff" stroke="#c8c8c2" stroke-width="1.2"/>
  <text x="500" y="30" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#19191a">Model (LLM)</text>

  <!-- 1: Tool Definition + Message (Application -> Model) -->
  <line x1="140" y1="82" x2="496" y2="82" stroke="#60605a" stroke-width="1.3" marker-end="url(#arrowSeq)"/>
  <rect x="185" y="58" width="270" height="46" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/>
  <text x="320" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#1c5fdd">get_weather(location)</text>
  <text x="320" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">"What is the weather in Paris today?"</text>
  <circle cx="140" cy="70" r="10" fill="#1c5fdd"/>
  <text x="140" y="74" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">1</text>

  <!-- 2: Tool Calls (Model -> Application) -->
  <line x1="500" y1="140" x2="144" y2="140" stroke="#60605a" stroke-width="1.3" marker-end="url(#arrowSeq)"/>
  <rect x="185" y="120" width="270" height="34" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/>
  <text x="320" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#1c5fdd">Tool Calls: get_weather("Paris")</text>
  <circle cx="500" cy="134" r="10" fill="#1c5fdd"/>
  <text x="500" y="138" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">2</text>

  <!-- 3: Execute Function Call (self-call on Application) -->
  <line x1="140" y1="200" x2="150" y2="200" stroke="#60605a" stroke-width="1.3" marker-end="url(#arrowSeq)"/>
  <rect x="150" y="214" width="230" height="62" rx="6" fill="#fff" stroke="#c8c8c2" stroke-width="1.2"/>
  <text x="265" y="234" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#19191a">Execute Function Call</text>
  <text x="265" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">get_weather("Paris")</text>
  <text x="265" y="264" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">{"temperature": 14}</text>
  <circle cx="140" cy="188" r="10" fill="#1c5fdd"/>
  <text x="140" y="192" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">3</text>

  <!-- 4: Results (Application -> Model) -->
  <line x1="140" y1="320" x2="496" y2="320" stroke="#60605a" stroke-width="1.3" marker-end="url(#arrowSeq)"/>
  <rect x="185" y="298" width="270" height="44" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/>
  <text x="320" y="316" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#1c5fdd">Results: All Prior Messages</text>
  <text x="320" y="332" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">{"temperature": 18}</text>
  <circle cx="140" cy="308" r="10" fill="#1c5fdd"/>
  <text x="140" y="312" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">4</text>

  <!-- 5: Final Response (Model -> Application) -->
  <line x1="500" y1="386" x2="144" y2="386" stroke="#60605a" stroke-width="1.3" marker-end="url(#arrowSeq)"/>
  <rect x="185" y="362" width="270" height="46" rx="6" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/>
  <text x="320" y="382" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#1c5fdd">Final Response</text>
  <text x="320" y="398" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">"Currently in Paris it's 18°C"</text>
  <circle cx="500" cy="374" r="10" fill="#1c5fdd"/>
  <text x="500" y="378" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#fff">5</text>

  <!-- lifeline footers -->
  <rect x="60" y="430" width="160" height="30" rx="6" fill="#fff" stroke="#c8c8c2" stroke-width="1.2"/>
  <text x="140" y="450" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#19191a">Application</text>
  <rect x="420" y="430" width="160" height="30" rx="6" fill="#fff" stroke="#c8c8c2" stroke-width="1.2"/>
  <text x="500" y="450" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#19191a">Model (LLM)</text>
</svg>
