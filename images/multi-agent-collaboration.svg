<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowMCP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9a9a94" />
    </marker>
  </defs>
  <rect x="20" y="50" width="200" height="80" rx="8" fill="#edf2ff" stroke="#1c5fdd" stroke-width="1.2"/>
  <text x="120" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1c5fdd">MCP Client</text>
  <text x="120" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">invokes tools</text>
  <text x="120" y="108" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">queries resources</text>
  <text x="120" y="122" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#60605a">interpolates prompts</text>

  <rect x="420" y="50" width="200" height="80" rx="8" fill="#fff" stroke="#c8c8c2" stroke-width="1.2"/>
